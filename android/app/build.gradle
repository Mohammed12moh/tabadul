plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.tabadul.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.tabadul.app"
        minSdk flutter.minSdkVersion
        targetSdk = 35
        versionCode 1
        versionName "1.0.0"
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

// حماية: حذف أي ic_launcher.png تالف داخل drawable (يسبب فشل AAPT)
def strayIcon = file("src/main/res/drawable/ic_launcher.png")
if (strayIcon.exists()) {
    strayIcon.delete()
}

